<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>旅游行程 · 多城市切换</title>
<style>
:root{--blue:#3A89D9;--blue-deep:#2670B8;--blue-light:#DCEFFB;--blue-bg:#EDF6FC;--ink:#1B3A5B;--ink-soft:#4A6B8A;--card:#fff;--shadow:0 4px 16px rgba(74,144,217,.12)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--blue-bg);color:var(--ink);line-height:1.6}
header{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);padding:16px 24px;box-shadow:var(--shadow);z-index:10}
header h1{color:var(--blue-deep);margin-bottom:12px;font-size:22px}
#cityTabs{display:flex;flex-wrap:wrap;gap:10px}
.city-tab{padding:8px 20px;border:2px solid var(--blue-light);border-radius:20px;background:#fff;color:var(--ink);cursor:pointer;font-size:14px;transition:.2s}
.city-tab:hover{border-color:var(--blue)}
.city-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
#app{max-width:1000px;margin:0 auto;padding:28px 20px 60px}
#app h2{color:var(--ink);margin-bottom:18px;font-size:20px}
.trip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.trip-card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);transition:.2s}
.trip-card:hover{transform:translateY(-3px)}

.trip-info{padding:14px 16px}
.trip-day{font-size:12px;color:var(--blue);font-weight:700;margin-bottom:4px}
.trip-spot{font-size:17px;font-weight:700;margin-bottom:6px}
.trip-intro{font-size:13px;color:var(--ink-soft);line-height:1.5}
</style>
</head>
<body>
<header>
  <h1>🌍 旅游行程攻略 · 切换城市查看行程</h1>
  <div id="cityTabs"></div>
</header>
<main id="app"></main>
<script src="trip-data.js"></script>
<script src="trip-app.js"></script>
</body>
</html>
