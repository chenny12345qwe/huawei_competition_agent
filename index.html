<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="游哪儿 — 国内旅游攻略查询，按人群、主题、季节推荐城市，提供行程路线、交通、住宿、美食、避坑贴士，支持旅友晒图分享。">
<title>游哪儿 · 国内旅游攻略</title>
<link rel="stylesheet" href="style.css?v=2">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<div id="loading" class="loading-overlay">⏳ 加载中…</div>
<header class="topbar">
  <button class="logo" id="logo" aria-label="返回攻略首页">游哪儿 <span>· 不知道去哪儿？帮你选</span></button>
  <nav class="nav-tabs" role="tablist">
    <button class="nav-tab active" id="tab-guide" role="tab" aria-selected="true">🏠 攻略</button>
    <button class="nav-tab" id="tab-trip" role="tab" aria-selected="false">🗺️ 行程</button>
    <button class="nav-tab" id="tab-photo" role="tab" aria-selected="false">📸 晒图</button>
    <button class="nav-tab" id="tab-cost" role="tab" aria-selected="false">💰 花费</button>
    <button class="nav-tab" id="tab-journal" role="tab" aria-selected="false">📔 手账</button>
  </nav>
  <div class="search-box" id="searchBox">
    <input id="searchInput" type="text" placeholder="搜城市 / 关键词，如 海滨、亲子、大理">
    <button id="searchBtn">搜索</button>
  </div>
</header>
<main>
  <div id="app"></div>
  <section id="tripView" class="hidden" role="tabpanel">
    <h2 class="view-title">🗺️ 多城市行程切换</h2>
    <div class="trip-search-bar"><input id="tripCitySearch" class="city-search-input" placeholder="搜索城市，如 北京、三亚" autocomplete="off"></div>
    <div id="tripApp"></div>
  </section>
  <section id="photoWall" class="hidden" role="tabpanel">
    <h3>📸 旅友晒图</h3>
    <div class="upload-bar">
      <input type="file" id="photoUpload" accept="image/*">
      <label class="cam-btn hidden" id="camWrap">📷 拍照<input type="file" id="photoCamera" accept="image/*" capture="environment" hidden></label>
      <span class="cam-tip hidden" id="camTip">📱 拍照功能仅在手机端可用</span>
      <fieldset class="vis-field">
        <legend>可见范围</legend>
        <label><input type="radio" name="vis" value="local" checked> 仅自己可见</label>
        <label><input type="radio" name="vis" value="public"> 公开共享</label>
      </fieldset>
      <input type="password" id="photoToken" placeholder="GitHub Token（公开需要）">
      <small class="token-tip">⚠️ Token 仅存本地，建议使用最小权限（public_repo）token，切勿泄露分享</small>
    </div>
    <div id="photoGrid" class="photo-grid"></div>
  </section>
  <section id="costView" class="hidden" role="tabpanel">
    <div class="cost-layout">
      <div class="cost-panel">
        <h2 class="view-title">💰 出行花费估算</h2>
        <div class="cost-form">
          <label>出发地 <input id="costFrom" class="city-search-input" autocomplete="off" placeholder="搜索城市"></label>
          <label>目的地 <input id="costTo" class="city-search-input" autocomplete="off" placeholder="搜索城市"></label>
          <label>出行方式 <select id="costMode">
            <option value="plane">✈️ 飞机</option>
            <option value="gaotie">🚄 高铁</option>
            <option value="train">🚂 火车</option>
            <option value="car">🚗 自驾</option>
            <option value="bus">🚌 大巴</option>
          </select></label>
          <button id="costBtn">计算花费</button>
        </div>
        <div id="costResult"></div>
      </div>
      <div id="costMap" class="cost-map-side"></div>
    </div>
  </section>
  <section id="journalView" class="hidden" role="tabpanel">
    <h2 class="view-title">📔 旅行手账</h2>
    <div class="journal-subtabs">
      <button class="journal-subtab active" id="subtabMine">📔 我的手账</button>
      <button class="journal-subtab" id="subtabSquare">🌐 公共广场</button>
    </div>
    <div id="journalMine">
      <div class="journal-toolbar">
        <button class="journal-new-btn" id="journalNew">✏️ 写手账</button>
        <select id="journalFilter" class="journal-filter">
          <option value="all">全部</option>
          <option value="food">🍜 美食</option>
          <option value="sight">🏞️ 景点</option>
          <option value="experience">🎉 体验</option>
          <option value="hotel">🏨 住宿</option>
          <option value="tips">💡 贴士</option>
        </select>
      </div>
      <div id="journalList" class="journal-grid"></div>
    </div>
    <div id="journalSquare" class="hidden">
      <p class="square-note">🌐 公共广场由 Supabase 免费配额提供公共存储，所有访客共享。免费版有访问与存储额度限制，仅供大赛作品演示，不作为正式线上服务。</p>
      <div id="squareList" class="journal-grid"></div>
      <div id="squareSentinel" class="square-sentinel"></div>
    </div>
  </section>
</main>
<div id="journalEditor" class="journal-modal hidden">
  <div class="journal-modal-card">
    <h3>✏️ 写手账</h3>
    <input id="journalTitle" class="journal-input" placeholder="给这次经历起个标题">
    <div class="journal-cat-tags" id="journalCatTags">
      <button class="journal-cat-tag active" data-cat="food">🍜 美食</button>
      <button class="journal-cat-tag" data-cat="sight">🏞️ 景点</button>
      <button class="journal-cat-tag" data-cat="experience">🎉 体验</button>
      <button class="journal-cat-tag" data-cat="hotel">🏨 住宿</button>
      <button class="journal-cat-tag" data-cat="tips">💡 贴士</button>
    </div>
    <input id="journalCity" class="city-search-input" placeholder="搜索城市" autocomplete="off">
    <textarea id="journalContent" class="journal-textarea" placeholder="分享你的旅行故事..." rows="5"></textarea>
    <label class="journal-upload-btn">📷 添加图片<input type="file" id="journalImgInput" multiple accept="image/*" hidden></label>
    <div id="journalImgPreview" class="journal-img-preview"></div>
    <p class="journal-map-hint">📍 点击地图标记位置（可选）</p>
    <div id="journalPickMap" class="journal-pick-map"></div>
    <input id="journalLocName" class="journal-input" placeholder="位置名称（如：故宫博物院）">
    <div class="journal-rating-row"><span>评分</span><div id="journalRating" class="journal-rating"></div></div>
    <div class="journal-modal-actions">
      <button id="journalSave" class="journal-save-btn">💾 存本地</button>
      <button id="journalPublish" class="journal-publish-btn">🌐 发布到广场</button>
      <button id="journalCancel" class="journal-cancel-btn">取消</button>
    </div>
  </div>
</div>
<div id="journalDetail" class="journal-modal hidden">
  <div class="journal-modal-card journal-detail-card">
    <div id="journalDetailContent"></div>
    <button id="journalDetailClose" class="journal-cancel-btn" style="margin-top:16px">关闭</button>
  </div>
</div>
<footer>共收录 <b id="cityCount"></b> 个旅游城市 · 攻略基于通用旅游知识整理，行前请核实实时信息<br>手账公共广场演示使用 Supabase 免费配额 BaaS，仅供大赛作品演示</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js?v=2"></script>
<script src="trip-data.js?v=2"></script>
<script src="city-utils.js?v=2"></script>
<script src="app.js?v=2"></script>
<script src="trip-app.js?v=2"></script>
<script src="photo-wall.js?v=2"></script>
<script src="cost-calculator.js?v=2"></script>
<script src="journal.js?v=2"></script>
</body>
</html>
